name: Build Horizon Custom (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-arm64.yml'
      - '.custom/**'
      - 'README.md'
      - 'CUSTOM_BUILD.md'
      - 'GITHUB_SETUP.md'

permissions:
  contents: read

concurrency:
  group: horizon-custom-arm64
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target

    steps:
      - name: Checkout your custom build configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Checkout pinned Android engine source
        run: |
          git clone --filter=blob:none https://github.com/Vasysik/horizon-android.git upstream
          git -C upstream fetch --depth=1 origin 150a414b09a18c900489d9462a7fc035dae744b7
          git -C upstream checkout --detach 150a414b09a18c900489d9462a7fc035dae744b7
          test "$(git -C upstream rev-parse HEAD)" = "150a414b09a18c900489d9462a7fc035dae744b7"

      - name: Apply Horizon Custom visual identity
        run: python3 .custom/brand.py --source upstream

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358'

      - name: Install Rust Android target for the pinned toolchain
        working-directory: upstream
        run: |
          rustup target add aarch64-linux-android
          rustup show active-toolchain
          rustc --version

      - name: Run source safety checks and Android tests
        working-directory: upstream
        run: |
          python3 tools/check_public_tree.py --history
          python3 -m unittest discover -s tests -p 'test_android*.py'

      - name: Prepare public Minecraft engine tables
        working-directory: upstream
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Compile, sign, and audit ARM64 APK
        working-directory: upstream
        run: |
          python3 tools/android_build.py \
            --abi arm64-v8a \
            --public \
            --profile release \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0 \
            --dev-build "custom.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Assemble APK, notices, and checksum
        working-directory: upstream
        run: |
          mkdir -p ../dist
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk ../dist/Horizon-Custom-arm64-v8a.apk
          cp LICENSE ../dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md ../dist/THIRD_PARTY_NOTICES.md
          cd ../dist
          sha256sum Horizon-Custom-arm64-v8a.apk > SHA256SUMS.txt
          cat > BUILD-INFO.txt <<EOF
          Product: Horizon Custom
          ABI: arm64-v8a
          Minimum Android: 9 (API 28)
          Engine repository: Vasysik/horizon-android
          Engine commit: 150a414b09a18c900489d9462a7fc035dae744b7
          Build run: ${GITHUB_RUN_NUMBER}
          Build source revision: ${GITHUB_SHA}
          Channel: development (separate application ID)
          Build profile: optimized release / public distribution
          EOF

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Horizon-Custom-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        if: always()
        run: |
          {
            echo '## Horizon Custom ARM64'
            echo 'The APK is attached as the **Horizon-Custom-ARM64** artifact only if all build and audit steps passed.'
            echo 'This is an experimental development build. Device compatibility and gameplay still require physical-device testing.'
          } >> "$GITHUB_STEP_SUMMARY"
